apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../base/models/dreamzero/
  - ../../base/models/cosmos3-nano/
  - ../../base/models/qwen3-omni/
  - ../../base/models/qwen25-cpu/
  - ../../base/models/qwen25-gpu/
  - ../../base/models/pi05/
  - ../../base/models/pi05_checkpoint/
  - ../../base/simulator/
  - ../../base/agent/

components:
  # Upstream hardcodes its own cluster's domain in the playground and agent
  # URLs. This overlay is the only one that pulls in base/agent/, so it is
  # also the only one where the DASHBOARD_URL patch matches anything.
  - ../../components/cluster-urls
  # Fix download jobs to work with OpenShift restricted SCC (set HOME=/tmp)
  - ../../components/fix-download-jobs

patches:
  - path: playground-ros2-config.yaml
  - path: simulator-fork-env.yaml
  - path: cyclonedds-rmw.yaml
