apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  # RHOAI 3.5.1 does not register the maas.opendatahub.io CRDs; see the
  # component for the full diagnosis. Drop this line once it does.
  - ../../components/no-maas-crs

patches:
  # dev carries no GPU models, so the playground's openpi policy has nothing
  # to dial and hangs in startup. See the patch for details.
  - path: playground-mock-policy.yaml
