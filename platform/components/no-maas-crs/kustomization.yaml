apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Drops every maas.opendatahub.io/v1alpha1 resource from the overlay that
# includes this component.
#
# Why: RHOAI 3.5.1 does not register the maas.opendatahub.io CRDs, so these
# resources can never be applied and hold the whole Application at
# OutOfSync/Degraded.
#
# MaaS used to be enabled via spec.components.kserve.modelsAsService. That
# field is deprecated and rejected at admission once Removed, and its
# replacement -- spec.components.aigateway.modelsAsAService -- is accepted by
# the DataScienceCluster v2 schema but has nothing behind it:
#
#   AIGatewayReady=False: Failed to get module status: no matches for kind
#   "AIGateway" in version "components.platform.opendatahub.io/v1alpha1"
#
# RHOAI 3.5.1 installs 14 components.platform.opendatahub.io CRDs and
# aigateways is not among them (neither is mcplifecycleoperators, which has a
# DSC field too -- both look like placeholders for components that have not
# shipped). 3.5.1 is the newest stable build: stable-3.5, stable-3.x and
# eus-3.5 all resolve to it.
#
# Remove this component from the overlay once an RHOAI release ships the
# AIGateway module. Nothing else needs to change -- the CRs themselves are
# untouched in platform/base/.
#
# The KServe serving path is unaffected; models still serve over their
# InferenceService endpoints, just without the MaaS front door.

patches:
  - target:
      group: maas.opendatahub.io
      kind: ExternalModel
    patch: |
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: ExternalModel
      metadata:
        name: placeholder
      $patch: delete

  - target:
      group: maas.opendatahub.io
      kind: MaaSModelRef
    patch: |
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSModelRef
      metadata:
        name: placeholder
      $patch: delete

  - target:
      group: maas.opendatahub.io
      kind: MaaSAuthPolicy
    patch: |
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSAuthPolicy
      metadata:
        name: placeholder
      $patch: delete

  - target:
      group: maas.opendatahub.io
      kind: MaaSSubscription
    patch: |
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSSubscription
      metadata:
        name: placeholder
      $patch: delete

  - target:
      group: maas.opendatahub.io
      kind: Tenant
    patch: |
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: Tenant
      metadata:
        name: placeholder
      $patch: delete
