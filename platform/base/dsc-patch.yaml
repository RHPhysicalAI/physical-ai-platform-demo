apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    # Apply before everything else. Enabling aigateway.modelsAsAService is what
    # registers the maas.opendatahub.io CRDs that the MaaS CRs in this same
    # overlay are instances of, so the DSC has to land first on a first install.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  components:
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
    # MaaS moved out of kserve in RHOAI 3.5. kserve.modelsAsService is deprecated
    # and cannot be re-enabled once Removed, so setting it is rejected outright:
    #   spec.components.kserve.modelsAsService: Invalid value: modelsAsService is
    #   deprecated; cannot re-enable once Removed. Use
    #   spec.components.aigateway.modelsAsAService instead
    # The "AsA" spelling is intentional -- it matches the ai-gateway-operator CRD
    # field, and the CRD description calls the JSON tag the authoritative surface.
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    modelregistry:
      managementState: Managed
    dashboard:
      managementState: Managed
    workbenches:
      managementState: Managed
    aipipelines:
      managementState: Managed
    trustyai:
      managementState: Managed
    feastoperator:
      managementState: Managed
    mlflowoperator:
      managementState: Managed
    llamastackoperator:
      managementState: Managed
