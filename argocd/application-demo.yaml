apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: physical-ai-platform-demo
  namespace: openshift-gitops
  labels:
    environment: demo
    profile: full
spec:
  project: default

  source:
    repoURL: https://github.com/RHPhysicalAI/physical-ai-platform-demo.git
    targetRevision: main
    path: platform/overlays/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: physical-ai

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # See application-dev.yaml: without this a first install deadlocks, as the
      # DSC that registers the maas.opendatahub.io CRDs shares a sync with the
      # MaaS CRs that need them.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /status
    # KServe controller mutates annotations on InferenceServices: it rewrites
    # deploymentMode (RawDeployment -> Standard in RHOAI 3.5) and adds
    # modelFormat. Without these the InferenceServices sit permanently
    # OutOfSync while reporting Healthy. Mirrors application-dev-gpu.yaml.
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /status
        - /metadata/annotations/serving.kserve.io~1deploymentMode
        - /metadata/annotations/modelFormat
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
    - group: apps
      kind: StatefulSet
      name: maas-db
      jsonPointers:
        - /spec/replicas
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/template
